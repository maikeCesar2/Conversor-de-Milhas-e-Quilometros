<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Conversor de Unidades</title>
</head>
<body>
    <h1>Conversor de Milhas e Quilômetros</h1>

    <input type="number" id="idInput" placeholder="Digite o valor" required>

    <br>

    <select id="idSelect">
        <option value="milesToKm">Miles para Kilometers</option>
        <option value="kmToMiles">Kilometers para Miles</option>
    </select>

    <br>

    <button id="converter">Converter</button>

    <p>Resultado: <span id="idSpan">0</span></p>

    <script src="script.js"></script>
</body>
</html>
